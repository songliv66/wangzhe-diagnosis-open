# Optional: copy to .github/workflows/check.yml with a token that can write workflows.
# This file is a manual example, not evidence of a completed GitHub Actions run.
name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_demo.py --output-dir /tmp/wangzhe-demo
